name: Cập nhật dữ liệu thị trường

on:
  schedule:
    - cron: "0 23 * * *"   # 6:00 sáng giờ Việt Nam mỗi ngày
  workflow_dispatch:        # cho phép bấm chạy tay trong tab Actions
  push:
    paths:
      - config.json
      - data/manual.csv
      - scripts/collect.mjs
      - .github/workflows/update.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # luôn lấy bản mới nhất, kể cả khi bấm chạy lại lần cũ
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Thu thập dữ liệu
        run: node scripts/collect.mjs
        env:
          # Secret ADMIN = tài khoản, ADMIN2 = mật khẩu đăng nhập dashboard
          DASHBOARD_USER: ${{ secrets.ADMIN }}
          DASHBOARD_PASSWORD: ${{ secrets.ADMIN2 }}
      - name: Lưu kết quả vào repo
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/history
          git diff --cached --quiet || git commit -m "Cập nhật dữ liệu $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git pull --rebase -X theirs   # xung đột thì giữ dữ liệu vừa thu thập
          git push
